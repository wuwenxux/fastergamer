<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="frogBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- app icon 圆角底板：纯黑 -->
  <rect width="512" height="512" rx="115" fill="#05070c"/>

  <g transform="translate(0 -80) translate(256 371) scale(1.25) translate(-256 -371)">
  <!-- 井：后沿砖圈（深灰勾边，黑底上显形）+ 黑洞 -->
  <ellipse cx="256" cy="404" rx="172" ry="58" fill="#232d3d"/>
  <ellipse cx="256" cy="396" rx="144" ry="44" fill="#000000"/>

  <!-- 青蛙：从井里探出来 -->
  <g transform="translate(256 400) scale(0.8) translate(-256 -400)">
    <!-- 身体 -->
    <ellipse cx="256" cy="372" rx="98" ry="66" fill="url(#frogBody)"/>
    <!-- 眼睛凸包 -->
    <circle cx="206" cy="300" r="36" fill="#4ade80"/>
    <circle cx="306" cy="300" r="36" fill="#4ade80"/>
    <!-- 眼白 -->
    <circle cx="206" cy="296" r="21" fill="#ffffff"/>
    <circle cx="306" cy="296" r="21" fill="#ffffff"/>
    <!-- 瞳孔（朝右上方看世界）+ 高光 -->
    <circle cx="212" cy="290" r="10" fill="#0f172a"/>
    <circle cx="312" cy="290" r="10" fill="#0f172a"/>
    <circle cx="215" cy="286" r="3.4" fill="#ffffff"/>
    <circle cx="315" cy="286" r="3.4" fill="#ffffff"/>
    <!-- 腮红 -->
    <ellipse cx="180" cy="336" rx="13" ry="8" fill="#f9a8d4" opacity="0.75"/>
    <ellipse cx="332" cy="336" rx="13" ry="8" fill="#f9a8d4" opacity="0.75"/>
    <!-- 微笑 -->
    <path d="M226 338 q30 22 60 0" fill="none" stroke="#14532d" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 井前沿：压住青蛙下半身，形成「爬出来」的层次 -->
  <path d="M84 404 a172 58 0 0 0 344 0 l0 26 a172 58 0 0 1 -344 0 z" fill="#161e2a"/>
  <!-- 前沿砖缝 -->
  <g stroke="#2f3d52" stroke-width="5" stroke-linecap="round">
    <path d="M150 428 l0 16"/>
    <path d="M256 440 l0 18"/>
    <path d="M362 428 l0 16"/>
  </g>

  <!-- 前爪搭在井沿上 -->
  <g transform="translate(256 400) scale(0.8) translate(-256 -400)">
    <ellipse cx="163" cy="404" rx="30" ry="18" fill="#22c55e" transform="rotate(-14 163 404)"/>
    <ellipse cx="349" cy="404" rx="30" ry="18" fill="#22c55e" transform="rotate(14 349 404)"/>
  </g>
  </g>
</svg>
