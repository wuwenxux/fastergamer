# Cloudflare 托管部署配置（与 workerd 本机模式并存，本地/阿里云仍用 wrangler.toml）
# 部署：cd workers/api && npx wrangler deploy --config wrangler.cf.toml
# 前端与 API 同源：pages/dist 由 Static Assets 托管，/api/* 走 Hono

name = "vpn-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# 保留 workers.dev 备用入口（配置 routes 后默认会被关掉，需显式开启）
workers_dev = true

# Workers Logpush：trace events 归档到 R2 桶 fg-logs（job 用 CF API 建，此处只开 Worker 侧开关）
# 必须放顶层——写在 [observability] 段后面会被 TOML 归进子表，wrangler 不认且 deploy 会把 API 侧设置抹回 false
logpush = true

# Workers Logs 持久化（付费计划能力）：声明在配置里防止 wrangler deploy 把 Dashboard/API 侧设置抹掉
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true

# 自定义域名（Workers Custom Domain，自动签发证书并创建 DNS 记录）
# uluw.kdns.fr 为备用订阅域：主域被 DNS 污染时用户整体切换入口，zone 需先在 CF 激活
routes = [
  { pattern = "fastergamer.click", custom_domain = true },
  { pattern = "www.fastergamer.click", custom_domain = true },
  { pattern = "uluw.kdns.fr", custom_domain = true },
]

# 前端静态站（pages/dist，先 cd pages && npm run build）
# 非 /api 路径由 index.ts 转给 ASSETS 绑定，SPA 回退在代码里处理
[assets]
directory = "../../pages/dist"
binding = "ASSETS"

# --- KV Namespaces（Cloudflare 真实命名空间，wrangler kv namespace create 生成） ---
[[kv_namespaces]]
binding = "TOKENS"
id = "f7d871af19cb4de6ba496979541d7c1e"

[[kv_namespaces]]
binding = "PLANS"
id = "10f74b3dfaad4c27a31b0efda2a4de21"

[[kv_namespaces]]
binding = "ORDERS"
id = "664bc26dca8049a7903a4b059ca98455"

[[kv_namespaces]]
binding = "NODES"
id = "67c4b5949d7144c095935bc1ea669eba"

[[kv_namespaces]]
binding = "TICKETS"
id = "f52063f8c3bf4c538ce26030fa2411db"

# --- Analytics Engine（遥测数据集，观测用途；数据点清单见 src/lib/telemetry.ts） ---
[[analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "fastergamer_telemetry"

# --- Queues（邮件异步化与重试，见 src/lib/email-aliyun.ts）。
# 队列本体需人工创建一次：npx wrangler queues create mail-queue --config wrangler.cf.toml ---
[[queues.producers]]
binding = "MAIL_QUEUE"
queue = "mail-queue"

[[queues.consumers]]
queue = "mail-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

# --- Email Service（发信，仅工单域邮件优先走此通道，见 src/lib/email-cf.ts）。
# 需 Workers 付费计划 + Dashboard 完成 fastergamer.click 域名 onboarding（CF 自动配 SPF/DKIM）；
# 本地 dev（wrangler.toml）不配此绑定，自动回退阿里云 DM ---
[[send_email]]
name = "EMAIL"

# --- Durable Objects（实时防共享全局裁决，见 src/do/share-guard.ts）。
# 心跳路由 /api/agent/presence 鉴权后转发到 idFromName("global") 的唯一实例；
# 状态全内存，逐出后由后续心跳重建。首次部署必须带下方 migrations ---
[durable_objects]
bindings = [{ name = "SHARE_GUARD", class_name = "ShareGuardDO" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShareGuardDO"]

# --- 环境变量 ---
# ADMIN_KEY / ALIYUN_* / ADMIN_NOTIFY_EMAIL / TURNSTILE_SECRET_KEY 均为 secret，
# 用 wrangler secret put --config wrangler.cf.toml 管理，不入库
# （EPAY_* 已随支付通道摘除从生产删除；如需恢复退款能力再 secret put 回来）
[vars]
# Turnstile 站点密钥（公开，经 /api/config 下发给前端决定是否渲染人机验证组件；
# 与 secret TURNSTILE_SECRET_KEY 配对，未配置时前后端都自动跳过验证）
TURNSTILE_SITE_KEY = "0x4AAAAAAE42NRWGV_8GZ7rk"
# 生产环境标记：CORS 不放行 localhost 来源（仅 wrangler.toml 的 dev 放行）
ENVIRONMENT = "production"

# 套餐列表从这里读取（也可用 /api/admin/seed 写入 KV）
DEFAULT_PLANS = "[]"

# Clash 订阅展示的地区列表
CLASH_REGIONS = '[{"code":"HK","flag":"🇭🇰","name":"香港"},{"code":"JP","flag":"🇯🇵","name":"日本"},{"code":"TW","flag":"🌐","name":"台湾"},{"code":"KR","flag":"🇰🇷","name":"韩国"},{"code":"MY","flag":"🇲🇾","name":"马来西亚"},{"code":"SG","flag":"🇸🇬","name":"新加坡"},{"code":"US","flag":"🇺🇸","name":"美国"}]'

# 官网地址，用于邮件内链接
SITE_URL = "https://fastergamer.click"

# 管理接口来源 IP 白名单（可选，逗号分隔，CIDR 或精确 IP；叠加在 x-admin-key 之上）。
# 覆盖站长的四川电信家宽网段（拨号换 IP 在 /16 内漂移）、运维本机出口与 hk01 跳板；
# 家宽网段若漂出新段，改这里重新 deploy 即可
ADMIN_IPS = "110.185.0.0/16,171.221.0.0/16,222.212.0.0/16,171.219.0.0/16,42.121.0.0/16,154.64.250.200"
