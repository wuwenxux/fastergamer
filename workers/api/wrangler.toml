# API Worker 本地开发配置（wrangler dev，miniflare 模拟 KV）
# 生产部署用 wrangler.cf.toml（Cloudflare 托管），见 README

name = "vpn-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# --- KV Namespaces ---
# 本地开发用占位 id；生产真实命名空间在 wrangler.cf.toml
[[kv_namespaces]]
binding = "TOKENS"
id = "918fba7374f24612bbc47c4ec62fb1c1"

[[kv_namespaces]]
binding = "PLANS"
id = "e6e88c0444fe4981b80e579debc73a8e"

[[kv_namespaces]]
binding = "ORDERS"
id = "e1d1d6a60bb24b38a366955e3c32587b"

[[kv_namespaces]]
binding = "NODES"
id = "b5d4e8c33a9f421d8e7b0f1234567890"

[[kv_namespaces]]
binding = "TICKETS"
id = "c6e5f9d44b0a5320e9f8c1a234567890"

# --- 环境变量 ---
[vars]
# 管理接口密钥：调用 /api/admin/* 时需在 header 携带 x-admin-key
# 真实值放在 .dev.vars（不入库），这里只是占位
ADMIN_KEY = "change-me-in-.dev.vars"

# 套餐列表从这里读取（也可用 /api/admin/seed 写入 KV）
DEFAULT_PLANS = "[]"

# Clash 订阅展示的地区列表
CLASH_REGIONS = '[{"code":"HK","flag":"🇭🇰","name":"香港"},{"code":"JP","flag":"🇯🇵","name":"日本"},{"code":"MY","flag":"🇲🇾","name":"马来西亚"},{"code":"SG","flag":"🇸🇬","name":"新加坡"},{"code":"US","flag":"🇺🇸","name":"美国"}]'

# 邮件走阿里云 DirectMail（ALIYUN_ACCESS_KEY_ID/SECRET 在 .dev.vars）
SITE_URL = "https://fastergamer.cn"

# 支付宝收款账号（静态转账模式展示给用户；当面付动态码启用时不会用到）
ALIPAY_ACCOUNT = "19115946187"
