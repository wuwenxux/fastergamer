# CloudVPN 网站 Nginx 配置（HTTP，托管在 VPS 裸 IP 上）
# 放置位置：/etc/nginx/sites-available/cloudvpn.conf
# 启用：sudo ln -s /etc/nginx/sites-available/cloudvpn.conf /etc/nginx/sites-enabled/
# 注意：裸 IP 无法申请 Let's Encrypt 证书，HTTPS 需要先绑定域名
#
# 本地模式拓扑：
#   /        → /var/www/cloudvpn 静态站（React SPA）
#   /api/    → 127.0.0.1:8787    本地 API Worker（wrangler dev --env local）
#   /vless-ws → 127.0.0.1:8443   本机 Xray 落地（Clash 走 ws://IP/vless-ws）
server {
    server_name wepindou.xyz _;

    # 前端静态站产物（scp 上传到这里）
    root /var/www/cloudvpn;
    index index.html;

    # API：透传到 Cloudflare API Worker（已部署: https://vpn-api.wwx0306.workers.dev）
    location /api/ {
        proxy_pass https://vpn-api.wwx0306.workers.dev;
        proxy_ssl_server_name on;
        proxy_set_header Host vpn-api.wwx0306.workers.dev;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # VLESS WS 入口：客户端 WebSocket 穿过 443 到本机 Xray
    # （VPS 服务商只透传 80/443，8443 公网不可达，Xray 只绑定回环口）
    location /vless-ws {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA 前端路由回退（/buy /tokens 等深层路径）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（文件名带 hash，可放心缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 基础安全头
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wepindou.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wepindou.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = wepindou.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name wepindou.xyz _;
    return 404; # managed by Certbot


}